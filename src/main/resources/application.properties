spring.application.name=DeliveryRouteOptimizer
# Server Port
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/delivery-db?createTableIfNotExists=true
spring.datasource.username=root
spring.datasource.password=sonu@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Traffic (Feature 5 & 6) - time-of-day multipliers applied on top of route cost/duration
traffic.peak.start=18:00
traffic.peak.end=20:00
traffic.moderate.start=08:00
traffic.moderate.end=10:00
traffic.multiplier.peak=2.0
traffic.multiplier.moderate=1.5
traffic.multiplier.normal=1.0

# Multi-stop delivery routing (Feature 7) - brute-force permutation search cap
optimizer.multi-stop.max-stops=8